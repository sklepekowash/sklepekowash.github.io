<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EkoWash — Spis myjni</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f8fa;color:#1a1d23;margin:0;padding:24px;text-align:center}
    main{max-width:700px;margin:10vh auto}
    .error{color:#c0392b}
  </style>
</head>
<body>
  <main id="loader"><h1>EkoWash</h1><p>Ładowanie katalogu materiałów…</p></main>
  <script>
  (async function(){
    // Ładujemy kompletną, niezmienną wersję aplikacji. Nie składamy katalogu
    // z drugiego pliku, dzięki czemu GitHub Pages nie pokazuje starej wersji.
    const appUrl='https://raw.githubusercontent.com/sklepekowash/sklepekowash.github.io/1acd31f175bc603756c7953905ef05b63ebeb08a/index.html?catalog=full';
    try{
      const response=await fetch(appUrl,{cache:'no-store'});
      if(!response.ok) throw new Error('Nie udało się pobrać pełnej aplikacji.');
      const app=await response.text();
      if(!app.includes('const BASE_CATALOG') || !app.includes('const STATIONS')) throw new Error('Pobrany plik nie zawiera pełnego katalogu.');
      document.open();
      document.write(app);
      document.close();
    }catch(error){
      document.getElementById('loader').innerHTML='<h1>EkoWash</h1><p class="error">'+error.message+'</p><p>Odśwież stronę, aby spróbować ponownie.</p>';
    }
  })();
  </script>
</body>
</html>
