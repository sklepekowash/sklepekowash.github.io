<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EkoWash — Spis myjni</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --card: #ffffff;
      --text: #17212f;
      --muted: #667085;
      --border: #dfe5ee;
      --accent: #2f5aa9;
      --accent-soft: #eaf1ff;
      --ok: #1f8a4c;
      --warn: #c0392b;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    header {
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 { margin: 0 0 10px; font-size: 18px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-btn {
      border: none; border-radius: 8px;
      background: rgba(255,255,255,0.12);
      color: white; font-weight: 700; padding: 8px 12px; cursor: pointer;
    }
    .tab-btn.active {
      background: white; color: var(--accent);
    }

    main {
      max-width: 1100px; margin: 0 auto;
      padding: 18px 14px 80px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .stage-nav {
      display: flex; flex-wrap: wrap; gap: 8px;
      align-items: center; margin-bottom: 14px;
    }

    .stage-chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .stage-chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .stage-chip.done {
      border-color: var(--ok);
      color: var(--ok);
    }

    .secondary-btn, .nav-btn, .small-btn {
      border: none; border-radius: 8px; cursor: pointer; font-weight: 700;
    }
    .secondary-btn {
      background: var(--accent-soft); color: var(--accent); padding: 9px 14px;
    }
    .nav-btn {
      background: var(--accent); color: white; padding: 9px 16px;
    }
    .small-btn {
      background: var(--accent-soft); color: var(--accent); padding: 7px 10px;
      font-size: 12px;
    }

    table {
      width: 100%; border-collapse: collapse; margin-top: 8px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 6px; text-align: left; vertical-align: middle;
    }
    th {
      color: var(--muted); text-transform: uppercase; font-size: 11px;
    }
    tr.inactive td { opacity: 0.45; }
    .code { font-weight: 700; font-family: Consolas, monospace; }
    .price-input, input[type=number], input[type=text] {
      width: 100%; max-width: 110px; padding: 6px 8px;
      border: 1px solid var(--border); border-radius: 6px; background: white; color: var(--text);
    }
    .code-input { max-width: 120px; font-family: Consolas, monospace; }
    .qty-input { max-width: 70px; }
    select {
      width: 100%; max-width: 180px; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: white; color: var(--text);
    }

    .subtotal, .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
      font-weight: 700;
    }

    .add-form {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px;
      padding-top: 16px; border-top: 1px dashed var(--border);
    }
    .add-form input[type=text] { min-width: 180px; max-width: none; flex: 1; }

    .sticky-footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      z-index: 20;
    }
    .grand-total { font-size: 18px; font-weight: 800; color: var(--accent); }

    textarea {
      width: 100%; min-height: 140px; padding: 10px; resize: vertical;
      border: 1px solid var(--border); border-radius: 8px; background: white; color: var(--text);
      font-family: Consolas, monospace; font-size: 12px;
    }

    .hint { color: var(--muted); font-size: 12px; }
    .danger { color: var(--warn); background: transparent; border: none; font-size: 18px; cursor: pointer; }

    .stage-actions {
      display: flex; gap: 8px; align-items: center;
    }
    .stage-actions button {
      border: none; background: none; cursor: pointer; font-size: 16px; padding: 4px 8px;
      border-radius: 4px; transition: background 0.2s;
    }
    .stage-actions button:hover {
      background: rgba(0,0,0,0.1);
    }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: white; border-radius: 12px; padding: 24px; max-width: 400px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .modal-content h3 { margin-top: 0; margin-bottom: 16px; }
    .modal-content input {
      width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; font-size: 14px;
    }
    .modal-buttons {
      display: flex; gap: 8px; justify-content: flex-end;
    }
    .modal-buttons button {
      border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: 700;
    }
    .modal-buttons .nav-btn { background: var(--accent); color: white; }
    .modal-buttons .secondary-btn { background: var(--border); color: var(--text); }

    @media (max-width: 700px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr {
        border: 1px solid var(--border); border-radius: 10px; background: white;
        padding: 10px; margin-bottom: 12px; display: block;
      }
      td { border: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      td::before {
        content: attr(data-label);
        color: var(--muted); font-size: 11px; text-transform: uppercase;
        font-weight: 700;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>EkoWash — Spis myjni</h1>
    <div id="tabs" class="tabs"></div>
  </header>

  <main id="main"></main>

  <footer class="sticky-footer">
    <span id="stageLabel">Stanowisko 4</span>
    <span id="grandTotal" class="grand-total">0,00 zł</span>
  </footer>

  <!-- Modal do edycji kodu produktu -->
  <div id="editCodeModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Zmień kod produktu</h3>
      <input id="editCodeInput" type="text" placeholder="Nowy kod" />
      <div class="modal-buttons">
        <button class="secondary-btn" onclick="closeEditCodeModal()">Anuluj</button>
        <button class="nav-btn" onclick="saveEditCode()">Zapisz</button>
      </div>
    </div>
  </div>

  <!-- Modal do edycji kategorii -->
  <div id="editCategoryModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Zmień kategorię</h3>
      <input id="editCategoryInput" type="text" placeholder="Nowa nazwa kategorii" />
      <div class="modal-buttons">
        <button class="secondary-btn" onclick="closeEditCategoryModal()">Anuluj</button>
        <button class="nav-btn" onclick="saveEditCategory()">Zapisz</button>
      </div>
    </div>
  </div>

  <script>
    const STATIONS = [2, 3, 4, 5, 6];
    const STORAGE_VERSION = 'ekowash-v3';

    const BASE_CATALOG = [
      { code: 'GUE06-ZPR', name: 'GUEST 6mm złączka prosta', stage: '1. Instalacja hydrauliczna' },
      { code: 'GUE08-ZPR', name: 'GUEST 8mm złączka prosta', stage: '1. Instalacja hydrauliczna' },
      { code: 'GUE12-ZPR', name: 'GUEST 12mm złączka prosta', stage: '1. Instalacja hydrauliczna' },
      { code: 'GUE22-ZPR', name: 'GUEST 22mm złączka prosta', stage: '1. Instalacja hydrauliczna' },
      { code: 'LAN60-PRO-SZE', name: 'Lanca prosta 60cm', stage: '3. Lance, pistolety, dysze' },
      { code: 'LAN70-ZAG-ZLO', name: 'Lanca zagięta 70cm', stage: '3. Lance, pistolety, dysze' },
      { code: 'PIS-ST1100', name: 'Pistolet ST 1100', stage: '3. Lance, pistolety, dysze' },
      { code: 'DYS-4003', name: 'Dysza LECHLER 4003', stage: '3. Lance, pistolety, dysze' },
      { code: 'ELE-TRM', name: 'Terminal płatniczy', stage: '5. Elektryka i elektronika' },
      { code: 'ELE-WRZ', name: 'Wrzutnik monet', stage: '5. Elektryka i elektronika' },
      { code: 'POM-CAT-350', name: 'Pompa CAT 350', stage: '7. Pompy' },
      { code: 'POM-HYD', name: 'Pompa Hydroo', stage: '7. Pompy' },
      { code: 'CHE20-SZA-H', name: 'Szampon Premium Wash', stage: '6. Chemia myjniowa' },
      { code: 'CHE20-WOS-H', name: 'Wosk Glance Wash', stage: '6. Chemia myjniowa' },
      { code: 'PAN-KPL', name: 'Panel stanowiska', stage: '4. Panel i pulpit' },
      { code: 'PAN-DRZ', name: 'Drzwi pulpitu', stage: '4. Panel i pulpit' },
      { code: 'RWM-STD', name: 'Rozmieniarka standard', stage: '10. Rozmieniarka' },
      { code: 'WEZ06-STC', name: 'Wą�� stanowiskowy DN6', stage: '2. Węże' },
      { code: 'WEZ08-STC', name: 'Wąż stanowiskowy DN8', stage: '2. Węże' }
    ];

    let currentStation = 4;
    let currentStage = '1. Instalacja hydrauliczna';
    let view = 'stage';
    let prices = {};
    let customItems = [];
    let stageOverride = {};
    let extraStages = [];
    let boms = {};
    let notes = {};
    let codeMapping = {}; // Mapowanie starych kodów na nowe

    // Zmienne dla modalów
    let editingItemCode = null;
    let editingCategoryName = null;

    function safeStorageGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch {
        return fallback;
      }
    }

    function safeStorageSet(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // ignore storage write issues
      }
    }

    function resetStorageIfNeeded() {
      const saved = safeStorageGet('ekw_storage_version', null);
      if (saved !== STORAGE_VERSION) {
        try {
          Object.keys(localStorage)
            .filter(key => key.indexOf('ekw_') === 0 || key === 'ekw_storage_version')
            .forEach(key => localStorage.removeItem(key));
        } catch {
          // ignore if storage not available
        }
        safeStorageSet('ekw_storage_version', STORAGE_VERSION);
      }
    }

    function allItems() {
      return BASE_CATALOG.concat(customItems);
    }

    function effectiveStage(item) {
      return stageOverride[item.code] || item.stage;
    }

    function allStages() {
      const stages = new Set(extraStages);
      allItems().forEach(item => stages.add(effectiveStage(item)));
      return [...stages].sort();
    }

    function loadState() {
      prices = safeStorageGet('ekw_prices', {});
      customItems = safeStorageGet('ekw_custom', []);
      stageOverride = safeStorageGet('ekw_stage_override', {});
      extraStages = safeStorageGet('ekw_extra_stages', []);
      codeMapping = safeStorageGet('ekw_code_mapping', {});

      STATIONS.forEach(station => {
        boms[station] = safeStorageGet('ekw_bom_' + station, {});
        notes[station] = safeStorageGet('ekw_notes_' + station, '');
      });
    }

    function saveState() {
      safeStorageSet('ekw_prices', prices);
      safeStorageSet('ekw_custom', customItems);
      safeStorageSet('ekw_stage_override', stageOverride);
      safeStorageSet('ekw_extra_stages', extraStages);
      safeStorageSet('ekw_code_mapping', codeMapping);

      STATIONS.forEach(station => {
        safeStorageSet('ekw_bom_' + station, boms[station]);
        safeStorageSet('ekw_notes_' + station, notes[station]);
      });
    }

    function getItemEntry(station, code) {
      const bom = boms[station] || {};
      if (!bom[code]) bom[code] = { active: false, qty: 0 };
      return bom[code];
    }

    function toggleActive(station, code, checked) {
      const entry = getItemEntry(station, code);
      entry.active = checked;
      if (checked && (!entry.qty || entry.qty <= 0)) entry.qty = 1;
      saveState();
      render();
    }

    function setQty(station, code, value) {
      const entry = getItemEntry(station, code);
      entry.qty = Number(value) || 0;
      saveState();
      render();
    }

    function setPrice(code, value) {
      if (value === '') delete prices[code];
      else prices[code] = Number(value) || 0;
      saveState();
      render();
    }

    function itemValue(station, item) {
      const entry = getItemEntry(station, item.code);
      const unitPrice = Number(prices[item.code]) || 0;
      return entry.active ? (entry.qty || 0) * unitPrice : 0;
    }

    function stageTotal(station, stageName) {
      let total = 0;
      allItems().forEach(item => {
        if (effectiveStage(item) === stageName) {
          total += itemValue(station, item);
        }
      });
      return total;
    }

    function grandTotal(station) {
      let total = 0;
      allItems().forEach(item => {
        total += itemValue(station, item);
      });
      return total;
    }

    function hasStageItems(station, stageName) {
      return allItems().some(item => effectiveStage(item) === stageName && getItemEntry(station, item.code).active);
    }

    function moveItem(code, newStage) {
      if (newStage === '__new__') {
        const name = prompt('Nazwa nowej kategorii:');
        if (!name) return;
        stageOverride[code] = name;
      } else {
        stageOverride[code] = newStage;
      }
      saveState();
      render();
    }

    function addCategory() {
      const name = prompt('Nazwa nowej kategorii:');
      if (!name) return;
      const clean = name.trim();
      if (!clean) return;
      if (!extraStages.includes(clean)) extraStages.push(clean);
      currentStage = clean;
      view = 'stage';
      saveState();
      render();
    }

    function openEditCategoryModal(oldName) {
      editingCategoryName = oldName;
      const input = document.getElementById('editCategoryInput');
      input.value = oldName;
      document.getElementById('editCategoryModal').classList.add('active');
      input.focus();
    }

    function closeEditCategoryModal() {
      document.getElementById('editCategoryModal').classList.remove('active');
      editingCategoryName = null;
    }

    function saveEditCategory() {
      const newName = document.getElementById('editCategoryInput').value.trim();
      if (!newName || newName === editingCategoryName) {
        closeEditCategoryModal();
        return;
      }

      allItems().forEach(item => {
        if (effectiveStage(item) === editingCategoryName) stageOverride[item.code] = newName;
      });

      const idx = extraStages.indexOf(editingCategoryName);
      if (idx >= 0) extraStages[idx] = newName;
      if (currentStage === editingCategoryName) currentStage = newName;
      saveState();
      closeEditCategoryModal();
      render();
    }

    function deleteCategory(categoryName) {
      if (!confirm('Usunąć kategorię "' + categoryName + '"?\n\nProdukty będą przeniesione do kategorii domyślnej.')) return;

      const defaultStage = BASE_CATALOG[0]?.stage || '1. Instalacja hydrauliczna';
      allItems().forEach(item => {
        if (effectiveStage(item) === categoryName) delete stageOverride[item.code];
      });

      const idx = extraStages.indexOf(categoryName);
      if (idx >= 0) extraStages.splice(idx, 1);
      if (currentStage === categoryName) currentStage = defaultStage;
      saveState();
      render();
    }

    function openEditCodeModal(code) {
      editingItemCode = code;
      const input = document.getElementById('editCodeInput');
      input.value = code;
      document.getElementById('editCodeModal').classList.add('active');
      input.focus();
      input.select();
    }

    function closeEditCodeModal() {
      document.getElementById('editCodeModal').classList.remove('active');
      editingItemCode = null;
    }

    function saveEditCode() {
      const newCode = document.getElementById('editCodeInput').value.trim();
      if (!newCode || newCode === editingItemCode) {
        closeEditCodeModal();
        return;
      }

      if (allItems().some(item => item.code === newCode)) {
        alert('Kod "' + newCode + '" już istnieje!');
        return;
      }

      // Zaktualizuj kod
      const item = allItems().find(i => i.code === editingItemCode);
      if (item) {
        item.code = newCode;
        // Przenies cenę
        if (editingItemCode in prices) {
          prices[newCode] = prices[editingItemCode];
          delete prices[editingItemCode];
        }
        // Przenies stage override
        if (editingItemCode in stageOverride) {
          stageOverride[newCode] = stageOverride[editingItemCode];
          delete stageOverride[editingItemCode];
        }
        // Przenies BOM dla wszystkich stacji
        STATIONS.forEach(station => {
          if (boms[station][editingItemCode]) {
            boms[station][newCode] = boms[station][editingItemCode];
            delete boms[station][editingItemCode];
          }
        });
        codeMapping[editingItemCode] = newCode;
        saveState();
        closeEditCodeModal();
        render();
      }
    }

    function renameStage(oldName) {
      openEditCategoryModal(oldName);
    }

    function deleteCustom(code) {
      if (!confirm('Usunąć tę pozycję?')) return;
      customItems = customItems.filter(item => item.code !== code);
      delete prices[code];
      delete stageOverride[code];
      STATIONS.forEach(station => {
        delete boms[station][code];
      });
      saveState();
      render();
    }

    function addCustomItem(station, stageName) {
      const nameInput = document.getElementById('newName');
      const qtyInput = document.getElementById('newQty');
      const priceInput = document.getElementById('newPrice');
      const codeInput = document.getElementById('newCode');
      const name = (nameInput.value || '').trim();
      const customCode = (codeInput.value || '').trim();

      if (!name) {
        nameInput.focus();
        return;
      }

      const code = customCode || 'WLASNY-' + Date.now();
      
      // Sprawdź czy kod już istnieje
      if (allItems().some(item => item.code === code)) {
        alert('Kod "' + code + '" już istnieje!');
        return;
      }

      customItems.push({ code, name, stage: stageName });
      prices[code] = Number(priceInput.value) || 0;
      const entry = getItemEntry(station, code);
      entry.active = true;
      entry.qty = Number(qtyInput.value) || 1;

      nameInput.value = '';
      qtyInput.value = '1';
      priceInput.value = '';
      codeInput.value = '';
      saveState();
      render();
    }

    function applyPriceImport() {
      const area = document.getElementById('cennikArea');
      const text = area.value || '';
      let count = 0;

      text.split(/\n/).forEach(line => {
        const pieces = line.split(/[\t;]/).map(item => item.trim());
        if (pieces.length >= 2) {
          const code = pieces[0];
          const price = Number(String(pieces[1]).replace(',', '.').replace(/[^0-9.]/g, ''));
          if (code && Number.isFinite(price)) {
            prices[code] = price;
            count += 1;
          }
        }
      });

      saveState();
      document.getElementById('cennikMsg').textContent = 'Zaktualizowano ' + count + ' cen.';
      render();
    }

    function renderTabs() {
      const tabs = STATIONS.map(station => `
        <button class="tab-btn ${station === currentStation ? 'active' : ''}" onclick="selectStation(${station})">
          ${station} stanowiska
        </button>
      `).join('');
      document.getElementById('tabs').innerHTML = tabs;
    }

    function renderStageNavigation() {
      const stages = allStages();
      const isExtraStage = extraStages.includes(currentStage);
      const buttons = stages.map(stageName => {
        const active = stageName === currentStage && view === 'stage';
        const done = hasStageItems(currentStation, stageName);
        const isExtra = extraStages.includes(stageName);
        return `
          <span class="stage-chip ${active ? 'active' : ''} ${done ? 'done' : ''}">
            <span onclick="selectStage('${stageName.replace(/'/g, "\\'")}' )">${stageName}</span>
            <div class="stage-actions">
              <button onclick="renameStage('${stageName.replace(/'/g, "\\'")}')" title="Zmień nazwę">✎</button>
              ${isExtra ? `<button onclick="deleteCategory('${stageName.replace(/'/g, "\\'")}')" title="Usuń kategorię">🗑️</button>` : ''}
            </div>
          </span>
        `;
      }).join('');

      return `
        <div class="stage-nav">
          ${buttons}
          <button class="small-btn" onclick="addCategory()">+ kategoria</button>
          <button class="stage-chip ${view === 'cennik' ? 'active' : ''}" onclick="setView('cennik')">💰 Cennik</button>
          <button class="stage-chip ${view === 'uwagi' ? 'active' : ''}" onclick="setView('uwagi')">📝 Uwagi</button>
          <button class="stage-chip ${view === 'summary' ? 'active' : ''}" onclick="setView('summary')">📋 Podsumowanie</button>
        </div>
      `;
    }

    function renderStageView() {
      const stageItems = allItems().filter(item => effectiveStage(item) === currentStage);
      const rows = stageItems.map(item => {
        const entry = getItemEntry(currentStation, item.code);
        const price = prices[item.code] ?? '';
        const isCustom = item.code.startsWith('WLASNY-');
        const stageOptions = allStages().map(stageName => `
          <option value="${stageName}" ${effectiveStage(item) === stageName ? 'selected' : ''}>${stageName}</option>
        `).join('');

        return `
          <tr class="${entry.active ? '' : 'inactive'}">
            <td data-label="Aktywne"><input type="checkbox" ${entry.active ? 'checked' : ''} onchange="toggleActive(${currentStation}, '${item.code}', this.checked)"></td>
            <td data-label="Kod" class="code" style="cursor: pointer; user-select: none;" onclick="openEditCodeModal('${item.code}');" title="Kliknij, aby edytować">${isCustom ? '✏️ ' : ''}${item.code}</td>
            <td data-label="Nazwa">${item.name}</td>
            <td data-label="Kategoria">
              <select onchange="moveItem('${item.code}', this.value)">
                ${stageOptions}
                <option value="__new__">+ nowa kategoria…</option>
              </select>
            </td>
            <td data-label="Ilość"><input class="qty-input" type="number" min="0" step="1" value="${entry.qty || 0}" onchange="setQty(${currentStation}, '${item.code}', this.value)"></td>
            <td data-label="Cena"><input class="price-input" type="number" min="0" step="0.01" value="${price}" onchange="setPrice('${item.code}', this.value)"></td>
            <td data-label="Wartość" style="font-weight:700; text-align:right;">${itemValue(currentStation, item).toFixed(2)} zł</td>
            <td data-label="Usuń">${isCustom ? '<button class="danger" onclick="deleteCustom(\'${item.code}\')">✕</button>' : ''}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="card">
          ${renderStageNavigation()}
          <h3>${currentStage}</h3>
          <table>
            <thead>
              <tr>
                <th>Aktywne</th>
                <th>Kod</th>
                <th>Nazwa</th>
                <th>Kategoria</th>
                <th>Ilość</th>
                <th>Cena</th>
                <th>Wartość</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>

          <div class="subtotal">
            <span>Suma etapu</span>
            <span>${stageTotal(currentStation, currentStage).toFixed(2)} zł</span>
          </div>

          <div class="add-form">
            <input id="newCode" type="text" placeholder="Kod (opcjonalnie)" class="code-input" />
            <input id="newName" type="text" placeholder="Nazwa produktu" />
            <input id="newQty" type="number" min="0" value="1" />
            <input id="newPrice" type="number" min="0" step="0.01" placeholder="Cena" />
            <button class="secondary-btn" onclick="addCustomItem(${currentStation}, '${currentStage.replace(/'/g, "\\'")}')">+ Dodaj do etapu</button>
          </div>

          <div style="display:flex; justify-content:space-between; gap:10px; margin-top:18px;">
            <button class="nav-btn" onclick="prevStage()">← Poprzedni etap</button>
            <button class="nav-btn" onclick="nextStage()">Następny etap →</button>
          </div>
        </div>
      `;
    }

    function renderSummary() {
      const stages = allStages();
      let total = 0;
      const rows = stages.map(stageName => {
        const val = stageTotal(currentStation, stageName);
        if (val <= 0) return '';
        total += val;
        return `
          <div class="summary-row">
            <span>${stageName}</span>
            <span>${val.toFixed(2)} zł</span>
          </div>
        `;
      }).join('');

      return `
        <div class="card">
          ${renderStageNavigation()}
          <h3>Podsumowanie — stanowisko ${currentStation}</h3>
          ${rows}
          <div class="summary-row" style="border-top:2px solid var(--accent); margin-top:10px; padding-top:12px; font-size:16px;">
            <span>RAZEM</span>
            <span>${total.toFixed(2)} zł</span>
          </div>
          ${notes[currentStation] ? `<div style="margin-top:16px;"><strong>Uwagi:</strong><div style="white-space:pre-wrap; margin-top:6px;">${notes[currentStation]}</div></div>` : ''}
        </div>
      `;
    }

    function renderUwagi() {
      return `
        <div class="card">
          ${renderStageNavigation()}
          <h3>Uwagi — stanowisko ${currentStation}</h3>
          <p class="hint">Dodatkowe informacje o tej konfiguracji.</p>
          <textarea id="notesArea" onchange="notes[currentStation] = this.value; saveState();">${notes[currentStation] || ''}</textarea>
        </div>
      `;
    }

    function renderCennik() {
      return `
        <div class="card">
          ${renderStageNavigation()}
          <h3>Import cennika</h3>
          <p class="hint">Wklej kod i cenę w formacie: KOD<TAB>CENA albo KOD;CENA</p>
          <textarea id="cennikArea" placeholder="GUE06-ZPR\t6,39\nGUE08-ZPR\t8,40"></textarea>
          <div style="margin-top:12px; display:flex; align-items:center; gap:12px;">
            <button class="nav-btn" onclick="applyPriceImport()">Zastosuj cennik</button>
            <span id="cennikMsg" class="hint"></span>
          </div>
        </div>
      `;
    }

    function render() {
      renderTabs();
      let body = '';

      if (view === 'summary') body = renderSummary();
      else if (view === 'uwagi') body = renderUwagi();
      else if (view === 'cennik') body = renderCennik();
      else body = renderStageView();

      document.getElementById('main').innerHTML = body;
      document.getElementById('grandTotal').textContent = grandTotal(currentStation).toFixed(2) + ' zł';
      document.getElementById('stageLabel').textContent = 'Stanowisko ' + currentStation + ' • ' + currentStage;
    }

    function selectStation(station) {
      currentStation = station;
      view = 'stage';
      render();
    }

    function selectStage(stageName) {
      currentStage = stageName;
      view = 'stage';
      render();
    }

    function setView(nextView) {
      view = nextView;
      render();
    }

    function prevStage() {
      const stages = allStages();
      const index = stages.indexOf(currentStage);
      if (index > 0) {
        currentStage = stages[index - 1];
        render();
      }
    }

    function nextStage() {
      const stages = allStages();
      const index = stages.indexOf(currentStage);
      if (index < stages.length - 1) {
        currentStage = stages[index + 1];
        render();
      } else {
        setView('summary');
      }
    }

    resetStorageIfNeeded();
    loadState();
    if (!allStages().length) currentStage = '1. Instalacja hydrauliczna';
    else if (allStages().indexOf(currentStage) === -1) currentStage = allStages()[0];
    render();
  </script>
</body>
</html>
