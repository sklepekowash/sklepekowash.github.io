<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EkoWash — Spis myjni</title>
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --text:#1a1d23; --muted:#6b7280;
  --border:#e3e6ea; --accent:#2e5395; --accent-bg:#eaf0fb;
  --ok:#1f8a4c; --warn:#c0392b; --header-bg:#2e5395; --header-text:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1c1f26; --text:#e8eaed; --muted:#9aa1ac;
    --border:#2b2f38; --accent:#6f9ceb; --accent-bg:#1e2a42;
    --ok:#4fbf7a; --warn:#e0665a; --header-bg:#1c2c4a; --header-text:#eef2fb;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --card:#1c1f26; --text:#e8eaed; --muted:#9aa1ac;
  --border:#2b2f38; --accent:#6f9ceb; --accent-bg:#1e2a42;
  --ok:#4fbf7a; --warn:#e0665a; --header-bg:#1c2c4a; --header-text:#eef2fb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-size:14px;
}
header{
  background:var(--header-bg); color:var(--header-text);
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  position:sticky; top:0; z-index:20;
}
header h1{margin:0 0 8px 0; font-size:16px; font-weight:600;}
.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tab-btn{
  background:rgba(255,255,255,0.12); color:var(--header-text); border:none;
  padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
}
.tab-btn.active{background:#fff; color:var(--header-bg);}
main{max-width:1000px; margin:0 auto; padding:14px; padding-bottom:90px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px;}
.stage-nav{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; align-items:center;}
.stage-chip{
  background:var(--card); border:1px solid var(--border); color:var(--text);
  padding:6px 10px; border-radius:16px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:4px;
}
.stage-chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.stage-chip.done{border-color:var(--ok); color:var(--ok);}
.stage-chip .edit-ic{opacity:0.6; font-size:11px;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; color:var(--muted); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase;}
td{padding:6px 4px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr.inactive td{opacity:0.4;}
.code{font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600;}
input[type=number]{width:60px; padding:4px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text);}
input.price-input{width:75px; padding:4px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text);}
input[type=checkbox]{width:16px; height:16px;}
select.stage-select{font-size:11px; padding:3px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); max-width:120px;}
.subtotal{text-align:right; font-weight:700; margin-top:10px; font-size:14px;}
.navrow{display:flex; justify-content:space-between; margin-top:14px; gap:8px;}
button.nav{
  background:var(--accent); color:#fff; border:none; padding:10px 18px;
  border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
}
button.nav.secondary{background:var(--accent-bg); color:var(--accent);}
button.small{background:var(--accent-bg); color:var(--accent); border:none; padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer;}
button.danger{background:transparent; color:var(--warn); border:none; cursor:pointer; font-size:14px;}
footer.sticky{
  position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border);
  padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:space-between; align-items:center; z-index:20;
}
.total-big{font-size:17px; font-weight:800; color:var(--accent);}
textarea{width:100%; min-height:140px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
.hint{color:var(--muted); font-size:12px; margin-top:6px;}
.summary-row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;}
.summary-row b{color:var(--accent);}
.addform{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); align-items:center;}
.addform input[type=text]{flex:1; min-width:140px; padding:6px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text);}
.addform input[type=number]{width:80px;}
@media print{
  header,.stage-nav,.navrow,footer.sticky,.no-print,.addform{display:none !important;}
  body{background:#fff; color:#000;}
}
.tab-wrap{display:inline-flex; align-items:center; gap:2px; border-radius:8px;}
.tab-wrap.active{background:rgba(255,255,255,0.18); padding-right:4px;}
.tab-ic{background:transparent; border:none; color:var(--header-text); cursor:pointer; font-size:13px; padding:6px 5px; opacity:0.85;}
.tab-ic:hover{opacity:1;}
.tab-btn.add{background:transparent; border:1px dashed rgba(255,255,255,0.5);}
.stage-chip .edit-ic{cursor:pointer; padding:0 2px;}
.stage-chip .edit-ic:hover{opacity:1;}
.card-head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.card-head h3{margin:8px 0;}
button.small.warn{color:var(--warn);}
button.icon{background:transparent; border:none; color:var(--accent); cursor:pointer; font-size:14px; padding:2px 4px;}
.row-actions{white-space:nowrap; text-align:right;}
.table-wrap{overflow-x:auto;}
.addform input.code-in{flex:0 1 150px; min-width:110px;}
#modal{position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal-box{background:var(--card); color:var(--text); border-radius:12px; padding:16px; width:100%; max-width:440px; max-height:90vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,0.3);}
.modal-box h3{margin:0 0 12px 0;}
label.mf{display:block; margin-bottom:10px;}
label.mf span{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
label.mf input, label.mf select{width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:14px; max-width:none;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
@media print{ #modal{display:none !important;} .row-actions{display:none;} }
</style>
</head>
<body>
<header>
  <h1>EkoWash — spis materiałowy myjni</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<footer class="sticky">
  <span id="stageLabel" style="color:var(--muted); font-size:12px;"></span>
  <span class="total-big" id="grandTotal">0,00 zł</span>
</footer>
<div id="modal" onclick="closeModal()"></div>

// ===== Stan aplikacji =====
let view = 'stage'; // 'stage' | 'summary' | 'cennik' | 'uwagi' | 'kosz'
let currentStage = null;

function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null?fallback:JSON.parse(v); }catch(e){ return fallback; }
}
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function lsDel(key){ try{ localStorage.removeItem(key); }catch(e){} }
function isObj(v){ return v && typeof v==='object' && !Array.isArray(v); }

// Stanowiska: [{id, name}] — id zgodne ze starymi kluczami (ekw_bom_2 itd.)
let stations = lsGet('ekw_stations', null);
if(!Array.isArray(stations) || !stations.length || !stations.every(s=>isObj(s) && s.id)){
  stations = [2,3,4,5,6].map(n=>({id:String(n), name:n+' stanowiska'}));
}
let currentStation = (stations.find(s=>s.id==='4') || stations[0]).id;

let prices = lsGet('ekw_prices', {}); if(!isObj(prices)) prices = {};
let customItems = lsGet('ekw_custom', []); if(!Array.isArray(customItems)) customItems = [];
customItems = customItems.filter(i=>isObj(i) && i.code && i.name);
let stageOverride = lsGet('ekw_stage_override', {}); if(!isObj(stageOverride)) stageOverride = {};
let extraStages = lsGet('ekw_extra_stages', []); if(!Array.isArray(extraStages)) extraStages = [];
extraStages = extraStages.filter(s=>typeof s==='string' && s.trim());
let itemEdits = lsGet('ekw_item_edits', {}); if(!isObj(itemEdits)) itemEdits = {};   // klucz -> {name, code}
let hiddenItems = lsGet('ekw_hidden_items', []); if(!Array.isArray(hiddenItems)) hiddenItems = []; // usunięte pozycje bazowe
let boms = {}, notes = {};
stations.forEach(s=>{
  const b = lsGet('ekw_bom_'+s.id, {}); boms[s.id] = isObj(b)?b:{};
  const n = lsGet('ekw_notes_'+s.id, ''); notes[s.id] = typeof n==='string'?n:'';
});

function saveStations(){ lsSet('ekw_stations', stations); }
function saveBom(id){ lsSet('ekw_bom_'+id, boms[id]); }
function savePrices(){ lsSet('ekw_prices', prices); }
function saveCustom(){ lsSet('ekw_custom', customItems); }
function saveOverride(){ lsSet('ekw_stage_override', stageOverride); }
function saveExtra(){ lsSet('ekw_extra_stages', extraStages); }
function saveEdits(){ lsSet('ekw_item_edits', itemEdits); }
function saveHidden(){ lsSet('ekw_hidden_items', hiddenItems); }
function saveNotes(id){ lsSet('ekw_notes_'+id, notes[id]); }

// ===== Pomocnicze =====
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function js(v){ return esc(JSON.stringify(v)); } // bezpieczny argument do onclick="..."
function money(v){ return v.toFixed(2).replace('.', ',')+' zł'; }
function stationName(id){ const s = stations.find(x=>x.id===id); return s?s.name:''; }

const hiddenSet = () => new Set(hiddenItems);
function allItems(){ const h = hiddenSet(); return BASE_CATALOG.filter(i=>!h.has(i.code)).concat(customItems); }
function isCustom(item){ return String(item.code).startsWith('WLASNY-'); }
function itemName(item){ return (itemEdits[item.code] && itemEdits[item.code].name) || item.name; }
function itemCode(item){
  const e = itemEdits[item.code];
  if(e && e.code !== undefined) return e.code;
  return isCustom(item) ? '' : item.code;
}
function effStage(item){ return stageOverride[item.code] || item.stage; }
function allStages(){
  const s = new Set(extraStages);
  allItems().forEach(i=>s.add(effStage(i)));
  return [...s].sort((a,b)=>a.localeCompare(b,'pl',{numeric:true}));
}
function ensureStage(){
  const list = allStages();
  if(!currentStage || !list.includes(currentStage)) currentStage = list[0] || null;
}

// ===== Okno dialogowe (edycja) =====
let modalSave = null;
function openModal(title, fields, onSave, saveLabel){
  let h = `<div class="modal-box" onclick="event.stopPropagation()"><h3>${esc(title)}</h3>`;
  fields.forEach(f=>{
    h += `<label class="mf"><span>${esc(f.label)}</span>`;
    if(f.type==='select'){
      h += `<select id="mf_${f.id}">${f.options.map(o=>`<option value="${esc(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    } else if(f.type==='info'){
      h += `<div class="hint" style="margin:0">${esc(f.value)}</div>`;
    } else {
      h += `<input id="mf_${f.id}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(f.value==null?'':f.value)}" placeholder="${esc(f.placeholder||'')}">`;
    }
    h += `</label>`;
  });
  h += `<div class="modal-actions"><button class="nav secondary" onclick="closeModal()">Anuluj</button>
    <button class="nav" onclick="submitModal()">${esc(saveLabel||'Zapisz')}</button></div></div>`;
  const m = document.getElementById('modal');
  m.innerHTML = h; m.style.display = 'flex';
  modalSave = ()=>{
    const vals = {};
    fields.forEach(f=>{ const el = document.getElementById('mf_'+f.id); if(el) vals[f.id] = el.value; });
    return onSave(vals);
  };
  const first = m.querySelector('input,select'); if(first) setTimeout(()=>first.focus(), 30);
}
function submitModal(){ if(modalSave && modalSave()===false) return; closeModal(); render(); }
function closeModal(){ const m = document.getElementById('modal'); m.style.display='none'; m.innerHTML=''; modalSave=null; }
document.addEventListener('keydown', e=>{
  const m = document.getElementById('modal');
  if(m.style.display!=='flex') return;
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && e.target.tagName==='INPUT') submitModal();
});

// ===== Stanowiska =====
function addStation(){
  openModal('Nowe stanowisko', [{id:'name', label:'Nazwa stanowiska', value:'', placeholder:'np. 7 stanowisk'}], v=>{
    const name = v.name.trim(); if(!name){ alert('Podaj nazwę.'); return false; }
    let id = 's'+Date.now();
    stations.push({id, name}); boms[id] = {}; notes[id] = '';
    saveStations(); currentStation = id; view = 'stage';
  }, 'Dodaj');
}
function addStationCopy(){
  const src = currentStation;
  openModal('Kopiuj stanowisko', [
    {id:'info', label:'Źródło', type:'info', value:stationName(src)+' (zaznaczone pozycje, ilości i uwagi)'},
    {id:'name', label:'Nazwa nowego stanowiska', value:stationName(src)+' (kopia)'}
  ], v=>{
    const name = v.name.trim(); if(!name){ alert('Podaj nazwę.'); return false; }
    const id = 's'+Date.now();
    stations.push({id, name}); boms[id] = JSON.parse(JSON.stringify(boms[src]||{})); notes[id] = notes[src]||'';
    saveStations(); saveBom(id); saveNotes(id); currentStation = id; view='stage';
  }, 'Kopiuj');
}
function renameStation(id){
  const s = stations.find(x=>x.id===id); if(!s) return;
  openModal('Zmień nazwę stanowiska', [{id:'name', label:'Nazwa stanowiska', value:s.name}], v=>{
    const name = v.name.trim(); if(!name){ alert('Podaj nazwę.'); return false; }
    s.name = name; saveStations();
  });
}
function deleteStation(id){
  if(stations.length<=1){ alert('Musi zostać przynajmniej jedno stanowisko.'); return; }
  if(!confirm('Usunąć stanowisko „'+stationName(id)+'” razem z jego spisem i uwagami?')) return;
  stations = stations.filter(x=>x.id!==id);
  delete boms[id]; delete notes[id]; lsDel('ekw_bom_'+id); lsDel('ekw_notes_'+id);
  saveStations();
  if(currentStation===id) currentStation = stations[0].id;
  render();
}
function moveStation(id, dir){
  const i = stations.findIndex(x=>x.id===id), j = i+dir;
  if(i<0 || j<0 || j>=stations.length) return;
  [stations[i], stations[j]] = [stations[j], stations[i]]; saveStations(); render();
}

// ===== Kategorie =====
function stageOptions(selected, exclude){
  return allStages().filter(s=>s!==exclude).map(s=>({value:s, label:s}));
}
function addCategory(){
  openModal('Nowa kategoria', [{id:'name', label:'Nazwa kategorii', value:'', placeholder:'np. 17. Oświetlenie'}], v=>{
    const name = v.name.trim(); if(!name){ alert('Podaj nazwę.'); return false; }
    if(!allStages().includes(name)){ extraStages.push(name); saveExtra(); }
    currentStage = name; view='stage';
  }, 'Dodaj');
}
function renameStage(oldName){
  openModal('Zmień nazwę kategorii', [{id:'name', label:'Nazwa kategorii', value:oldName}], v=>{
    const newName = v.name.trim(); if(!newName){ alert('Podaj nazwę.'); return false; }
    if(newName===oldName) return;
    allItems().forEach(i=>{ if(effStage(i)===oldName) stageOverride[i.code] = newName; });
    extraStages = extraStages.filter(s=>s!==oldName);
    if(!extraStages.includes(newName)) extraStages.push(newName);
    saveExtra(); saveOverride();
    if(currentStage===oldName) currentStage = newName;
  });
}
function deleteStage(name){
  const items = allItems().filter(i=>effStage(i)===name);
  const removeCat = ()=>{ extraStages = extraStages.filter(s=>s!==name); saveExtra(); if(currentStage===name) currentStage=null; };
  if(!items.length){
    if(!confirm('Usunąć pustą kategorię „'+name+'”?')) return;
    removeCat(); render(); return;
  }
  const opts = [{value:'__delete__', label:'Usuń wszystkie produkty z tej kategorii'}]
    .concat(stageOptions(null, name).map(o=>({value:o.value, label:'Przenieś do: '+o.label})));
  openModal('Usuń kategorię', [
    {id:'info', label:'Kategoria', type:'info', value:name+' — produktów: '+items.length},
    {id:'action', label:'Co zrobić z produktami?', type:'select', value:'__delete__', options:opts}
  ], v=>{
    if(v.action==='__delete__'){
      if(!confirm('Na pewno usunąć '+items.length+' produktów? Produkty z katalogu bazowego będzie można przywrócić z „Kosza”.')) return false;
      items.forEach(i=>removeItemData(i.code));
      saveAllAfterRemove();
    } else {
      items.forEach(i=>{ stageOverride[i.code] = v.action; }); saveOverride();
    }
    removeCat();
  }, 'Usuń kategorię');
}

// ===== Produkty =====
function editItem(key){
  const item = allItems().find(i=>i.code===key); if(!item) return;
  const fields = [
    {id:'name', label:'Nazwa produktu', value:itemName(item)},
    {id:'code', label:'Kod / SKU', value:itemCode(item), placeholder:'opcjonalnie'},
    {id:'stage', label:'Kategoria', type:'select', value:effStage(item), options:stageOptions().concat([{value:'__new__', label:'+ nowa kategoria…'}])},
    {id:'newStage', label:'Nazwa nowej kategorii (gdy wybrano „+ nowa kategoria”)', value:''},
    {id:'price', label:'Cena jednostkowa (zł)', type:'number', step:'0.01', value:prices[key]!==undefined?prices[key]:''}
  ];
  openModal('Edytuj produkt', fields, v=>{
    const name = v.name.trim(); if(!name){ alert('Nazwa nie może być pusta.'); return false; }
    const code = v.code.trim();
    const dup = allItems().find(i=>i.code!==key && code && itemCode(i)===code);
    if(dup && !confirm('Kod „'+code+'” ma już produkt: '+itemName(dup)+'. Zapisać mimo to?')) return false;
    let stage = v.stage;
    if(stage==='__new__'){ stage = v.newStage.trim(); if(!stage){ alert('Podaj nazwę nowej kategorii.'); return false; } }
    const e = {};
    if(name!==item.name) e.name = name;
    if(code!==(isCustom(item)?'':item.code)) e.code = code;
    if(Object.keys(e).length) itemEdits[key] = e; else delete itemEdits[key];
    if(stage!==item.stage) stageOverride[key] = stage; else delete stageOverride[key];
    const p = String(v.price).replace(',', '.');
    if(p==='') delete prices[key]; else prices[key] = parseFloat(p)||0;
    saveEdits(); saveOverride(); savePrices();
    currentStage = stage;
  });
}
function removeItemData(key){
  if(isCustom({code:key})){
    customItems = customItems.filter(i=>i.code!==key);
    delete prices[key]; delete stageOverride[key]; delete itemEdits[key];
    stations.forEach(s=>{ delete boms[s.id][key]; });
  } else {
    if(!hiddenItems.includes(key)) hiddenItems.push(key);
    stations.forEach(s=>{ if(boms[s.id][key]) boms[s.id][key].active = false; });
  }
}
function saveAllAfterRemove(){
  saveCustom(); savePrices(); saveOverride(); saveEdits(); saveHidden();
  stations.forEach(s=>saveBom(s.id));
}
function deleteItem(key){
  const item = allItems().find(i=>i.code===key); if(!item) return;
  const msg = isCustom(item) ? 'Usunąć produkt „'+itemName(item)+'” na stałe?'
    : 'Usunąć produkt „'+itemName(item)+'” ze spisu? (można go przywrócić z „Kosza”)';
  if(!confirm(msg)) return;
  removeItemData(key); saveAllAfterRemove(); render();
}
function restoreItem(key){ hiddenItems = hiddenItems.filter(k=>k!==key); saveHidden(); render(); }
function restoreAll(){ if(!confirm('Przywrócić wszystkie usunięte produkty?')) return; hiddenItems = []; saveHidden(); view='stage'; render(); }

function itemRow(station, item, stagesList){
  const bom = boms[station];
  const rec = bom[item.code] || {active:false, qty:0};
  const price = prices[item.code] !== undefined ? prices[item.code] : '';
  const value = (rec.active ? (rec.qty||0) * (parseFloat(price)||0) : 0);
  const k = js(item.code);
  const stageOpts = stagesList.map(s=>`<option value="${esc(s)}" ${effStage(item)===s?'selected':''}>${esc(s)}</option>`).join('');
  const code = itemCode(item);
  return `<tr class="${rec.active?'':'inactive'}">
    <td><input type="checkbox" ${rec.active?'checked':''} onchange="toggleActive(${js(station)},${k},this.checked)"></td>
    <td class="code">${isCustom(item)?'<span title="Produkt własny">✏️</span> ':''}${esc(code)||'<span style="color:var(--muted)">—</span>'}</td>
    <td>${esc(itemName(item))}</td>
    <td><select class="stage-select" onchange="moveItem(${k},this.value)">${stageOpts}<option value="__new__">+ nowa kategoria…</option></select></td>
    <td><input type="number" min="0" step="1" value="${rec.qty||0}" onchange="setQty(${js(station)},${k},this.value)"></td>
    <td><input type="number" min="0" step="0.01" class="price-input" value="${price}" placeholder="—" onchange="setPrice(${k},this.value)"></td>
    <td style="text-align:right; font-weight:600; white-space:nowrap;">${money(value)}</td>
    <td class="row-actions"><button class="icon" onclick="editItem(${k})" title="Edytuj">✎</button><button class="danger" onclick="deleteItem(${k})" title="Usuń">✕</button></td>
  </tr>`;
}

function toggleActive(station, code, checked){
  const bom = boms[station];
  if(!bom[code]) bom[code] = {active:false, qty:1};
  bom[code].active = checked;
  if(checked && !bom[code].qty) bom[code].qty = 1;
  saveBom(station); render();
}
function setQty(station, code, val){
  const bom = boms[station];
  if(!bom[code]) bom[code] = {active:true, qty:0};
  bom[code].qty = parseFloat(val)||0;
  saveBom(station); render();
}
function setPrice(code, val){
  if(val==='') delete prices[code]; else prices[code] = parseFloat(val);
  savePrices(); render();
}
function moveItem(code, newStage){
  if(newStage==='__new__'){
    openModal('Nowa kategoria', [{id:'name', label:'Nazwa nowej kategorii', value:''}], v=>{
      const name = v.name.trim(); if(!name){ alert('Podaj nazwę.'); return false; }
      stageOverride[code] = name; saveOverride();
    }, 'Przenieś');
    render(); return;
  }
  stageOverride[code] = newStage;
  saveOverride(); render();
}

function addCustomItem(station, stage){
  const nameEl = document.getElementById('newName');
  const name = nameEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  const code = document.getElementById('newCode').value.trim();
  const qty = parseFloat(document.getElementById('newQty').value)||1;
  const price = parseFloat(String(document.getElementById('newPrice').value).replace(',', '.'))||0;
  const key = 'WLASNY-' + Date.now();
  customItems.push({code:key, name, stage});
  if(code){ itemEdits[key] = {code}; saveEdits(); }
  prices[key] = price;
  boms[station][key] = {active:true, qty:qty};
  saveCustom(); savePrices(); saveBom(station);
  render();
}

// ===== Sumy =====
function stageTotal(station, stage){
  const bom = boms[station]; let t=0;
  allItems().filter(i=>effStage(i)===stage).forEach(i=>{
    const rec = bom[i.code];
    if(rec && rec.active) t += (rec.qty||0) * (parseFloat(prices[i.code])||0);
  });
  return t;
}
function grandTotal(station){
  const bom = boms[station]; let t=0;
  allItems().forEach(i=>{
    const rec = bom[i.code];
    if(rec && rec.active) t += (rec.qty||0) * (parseFloat(prices[i.code])||0);
  });
  return t;
}
function stageHasItems(stage, station){
  const bom = boms[station];
  return allItems().filter(i=>effStage(i)===stage).some(i=> bom[i.code] && bom[i.code].active);
}
function parseCennik(text){
  const map = {};
  BASE_CATALOG.concat(customItems).forEach(i=>{ map[i.code] = i.code; const c = itemCode(i); if(c) map[c] = i.code; });
  const lines = text.split(/\n/); let updated=0;
  lines.forEach(line=>{
    const parts = line.split(/\t|;/).map(s=>s.trim());
    if(parts.length>=2){
      const key = map[parts[0]] || parts[0];
      const p = parseFloat(parts[1].replace(',', '.').replace(/[^0-9.]/g,''));
      if(parts[0] && !isNaN(p)){ prices[key]=p; updated++; }
    }
  });
  savePrices();
  return updated;
}

// ===== Widok =====
function render(){
  ensureStage();
  const stagesList = allStages();
  const cs = js(currentStation);
  document.getElementById('tabs').innerHTML = stations.map(s=>{
    const act = s.id===currentStation;
    return `<span class="tab-wrap ${act?'active':''}"><button class="tab-btn ${act?'active':''}" onclick="selectStation(${js(s.id)})">${esc(s.name)}</button>${act?
      `<button class="tab-ic" onclick="renameStation(${js(s.id)})" title="Zmień nazwę stanowiska">✎</button><button class="tab-ic" onclick="moveStation(${js(s.id)},-1)" title="Przesuń w lewo">‹</button><button class="tab-ic" onclick="moveStation(${js(s.id)},1)" title="Przesuń w prawo">›</button><button class="tab-ic" onclick="deleteStation(${js(s.id)})" title="Usuń stanowisko">✕</button>`:''}</span>`;
  }).join('') + `<button class="tab-btn add" onclick="addStation()" title="Dodaj stanowisko">+ stanowisko</button><button class="tab-btn add" onclick="addStationCopy()" title="Kopiuj bieżące stanowisko">⧉ kopiuj</button>`;

  let html = '<div class="stage-nav no-print">';
  stagesList.forEach(st=>{
    const active = (st===currentStage && view==='stage');
    const done = stageHasItems(st, currentStation);
    html += `<span class="stage-chip ${active?'active':''} ${done?'done':''}">
      <span onclick="selectStage(${js(st)})">${esc(st)}</span>
      <span class="edit-ic" onclick="renameStage(${js(st)})" title="Zmień nazwę">✎</span>
      <span class="edit-ic" onclick="deleteStage(${js(st)})" title="Usuń kategorię">✕</span>
    </span>`;
  });
  html += `<button class="small" onclick="addCategory()">+ kategoria</button>`;
  html += `<button class="stage-chip ${view==='cennik'?'active':''}" onclick="setView('cennik')">💰 Cennik</button>`;
  html += `<button class="stage-chip ${view==='uwagi'?'active':''}" onclick="setView('uwagi')">📝 Uwagi</button>`;
  html += `<button class="stage-chip ${view==='summary'?'active':''}" onclick="setView('summary')">📋 Podsumowanie</button>`;
  if(hiddenItems.length) html += `<button class="stage-chip ${view==='kosz'?'active':''}" onclick="setView('kosz')">🗑 Kosz (${hiddenItems.length})</button>`;
  html += `</div>`;

  if(view==='cennik'){
    html += `<div class="card"><h3>Wklej cennik z wFirma</h3>
      <p class="hint">Wklej dwie kolumny: kod SKU i cena (rozdzielone tabulatorem lub średnikiem), po jednej pozycji w linii. Aktualizuje ceny dla wszystkich stanowisk naraz.</p>
      <textarea id="cennikArea" placeholder="GUE06-ZPR\t6,39
GUE06-ZPR-14GW\t9,29"></textarea>
      <div style="margin-top:8px;"><button class="nav" onclick="applyCennik()">Zastosuj cennik</button>
      <span id="cennikMsg" class="hint"></span></div></div>`;
  } else if(view==='uwagi'){
    html += `<div class="card"><h3>Uwagi — ${esc(stationName(currentStation))}</h3>
      <p class="hint">Wolne notatki dotyczące tej konkretnej konfiguracji (np. ustalenia z klientem, odstępstwa od standardu).</p>
      <textarea id="uwagiArea" oninput="notes[${cs}]=this.value; saveNotes(${cs});">${esc(notes[currentStation]||'')}</textarea>
    </div>`;
  } else if(view==='kosz'){
    const h = hiddenSet();
    const list = BASE_CATALOG.filter(i=>h.has(i.code));
    html += `<div class="card"><h3>Kosz — usunięte produkty (${list.length})</h3>
      <p class="hint">Produkty z katalogu bazowego, które zostały usunięte. Możesz je przywrócić.</p>
      <table><thead><tr><th>Kod</th><th>Nazwa</th><th>Kategoria</th><th></th></tr></thead><tbody>
      ${list.map(i=>`<tr><td class="code">${esc(itemCode(i))}</td><td>${esc(itemName(i))}</td><td>${esc(effStage(i))}</td>
        <td><button class="small" onclick="restoreItem(${js(i.code)})">Przywróć</button></td></tr>`).join('')}
      </tbody></table>
      ${list.length?`<div style="margin-top:12px;"><button class="nav secondary" onclick="restoreAll()">Przywróć wszystkie</button></div>`:''}</div>`;
  } else if(view==='summary'){
    html += `<div class="card"><h3>Podsumowanie — ${esc(stationName(currentStation))}</h3>`;
    let gt=0;
    stagesList.forEach(st=>{
      const t = stageTotal(currentStation, st);
      if(t>0){ gt+=t; html += `<div class="summary-row"><span>${esc(st)}</span><b>${money(t)}</b></div>`; }
    });
    html += `<div class="summary-row" style="border-top:2px solid var(--accent); margin-top:8px; font-size:16px;"><span>RAZEM</span><b>${money(gt)}</b></div>`;
    if(notes[currentStation]){ html += `<div style="margin-top:14px;"><b>Uwagi:</b><p style="white-space:pre-wrap;">${esc(notes[currentStation])}</p></div>`; }
    html += `<div style="margin-top:14px;"><button class="nav secondary" onclick="window.print()">Drukuj / eksportuj do PDF</button></div></div>`;
  } else if(!currentStage){
    html += `<div class="card"><h3>Brak kategorii</h3><p class="hint">Dodaj pierwszą kategorię przyciskiem „+ kategoria”.</p></div>`;
  } else {
    const items = allItems().filter(i=>effStage(i)===currentStage);
    const st = js(currentStage);
    html += `<div class="card"><div class="card-head"><h3>${esc(currentStage)}</h3>
        <span class="no-print"><button class="small" onclick="renameStage(${st})">✎ Zmień nazwę</button>
        <button class="small warn" onclick="deleteStage(${st})">✕ Usuń kategorię</button></span></div>
      <div class="table-wrap"><table><thead><tr><th></th><th>Kod</th><th>Nazwa</th><th>Kategoria</th><th>Ilość</th><th>Cena</th><th>Wartość</th><th></th></tr></thead>
      <tbody>${items.map(i=>itemRow(currentStation,i,stagesList)).join('') || `<tr><td colspan="8" class="hint">Brak produktów w tej kategorii — dodaj je poniżej.</td></tr>`}</tbody></table></div>
      <div class="subtotal">Suma etapu: ${money(stageTotal(currentStation,currentStage))}</div>
      <div class="addform no-print">
        <input type="text" id="newName" placeholder="Nazwa nowego produktu">
        <input type="text" id="newCode" class="code-in" placeholder="Kod (opcjonalnie)">
        <input type="number" id="newQty" placeholder="Ilość" value="1" min="0">
        <input type="number" id="newPrice" placeholder="Cena" step="0.01" min="0">
        <button class="nav secondary" onclick="addCustomItem(${cs},${st})">+ Dodaj do tej kategorii</button>
      </div>
      <div class="navrow no-print">
        <button class="nav secondary" onclick="prevStage()">← Poprzedni etap</button>
        <button class="nav" onclick="nextStage()">Następny etap →</button>
      </div>
    </div>`;
  }

  document.getElementById('main').innerHTML = html;
  document.getElementById('grandTotal').textContent = money(grandTotal(currentStation));
  document.getElementById('stageLabel').textContent = view==='summary'?'Podsumowanie':(view==='cennik'?'Cennik':(view==='uwagi'?'Uwagi':(view==='kosz'?'Kosz':(stationName(currentStation)+' • '+(currentStage||'')))));
}

function selectStation(s){ currentStation=s; view='stage'; render(); }
function selectStage(st){ currentStage=st; view='stage'; render(); }
function setView(v){ view=v; render(); }
function prevStage(){
  const list = allStages(); const idx = list.indexOf(currentStage);
  if(idx>0){ currentStage=list[idx-1]; render(); }
}
function nextStage(){
  const list = allStages(); const idx = list.indexOf(currentStage);
  if(idx<list.length-1){ currentStage=list[idx+1]; render(); } else { setView('summary'); }
}
function applyCennik(){
  const text = document.getElementById('cennikArea').value;
  const n = parseCennik(text);
  render();
  document.getElementById('cennikMsg').textContent = `Zaktualizowano ${n} cen.`;
}

render();
</script>
</body>
</html>
